name: Build Nabu Hyprland touch image
jobs:
  build-base-image:
    name: Build base image
    runs-on: ubuntu-24.04-arm
    steps:
    - name: Update apt cache
      run: sudo apt-get update
    - name: Install tools
      run: sudo apt-get install -y git arch-install-scripts wget libarchive-tools e2fsprogs pigz unzip
    - name: Checkout repository
      uses: actions/checkout@v7
      with:
        path: repo
    - name: Create and mount image
      run: |
        echo "::group::Create image"
        truncate -s 20G ./rootfs.img
        mkfs.ext4 ./rootfs.img
        echo "::endgroup::"
        echo "::group::Mount image"
        mkdir mountpoint
        sudo mount -o loop ./rootfs.img ./mountpoint/
        sudo mkdir ./mountpoint/boot/efi/ -p
        sudo mount -o size=512M,mode=0755 -t tmpfs none ./mountpoint/boot/efi/
        echo "::endgroup::"
    - name: Download generic rootfs tarball
      run: |
        if ! wget --timeout=30 --tries=2 --waitretry=5 "https://os.archlinuxarm.org/os/ArchLinuxARM-aarch64-latest.tar.gz" -qO ArchLinuxARM-aarch64-latest.tar.gz; then
          echo "Primary mirror failed, falling back to GitHub release"
          wget --timeout=30 --tries=2 "https://github.com/Kumar-Jy/nabu-pkgs/releases/download/repo/ArchLinuxARM-aarch64-latest.tar.gz" -qO ArchLinuxARM-aarch64-latest.tar.gz
        fi
    - name: Build rootfs-extractor image
      run: |
        echo '
        FROM alpine:latest
        RUN apk add --no-cache libarchive-tools
        ENTRYPOINT ["/bin/sh"]
        ' > Dockerfile
        docker build -t rootfs-extractor .
    - name: Extract rootfs
      run: |
        docker run --rm \
          -v ${{ github.workspace }}/ArchLinuxARM-aarch64-latest.tar.gz:/rootfs.tar \
          -v ${{ github.workspace }}/mountpoint:/mountpoint \
          rootfs-extractor -c "
            cd /mountpoint && bsdtar -xpf /rootfs.tar
          "
    - name: Init pacman key store
      run: |
        sudo arch-chroot ./mountpoint bash - <<'EOF'
        set -e
        pacman-key --init
        pacman-key --populate archlinuxarm
        EOF
    - name: Configure pacman mirrorlist
      run: |
        sudo arch-chroot ./mountpoint bash - <<'EOF'
        set -e
        cat > /etc/pacman.d/mirrorlist <<'EOM'
        Server = https://ca.us.mirror.archlinuxarm.org/$arch/$repo
        Server = https://nj.us.mirror.archlinuxarm.org/$arch/$repo
        EOM
        EOF
    - name: Delete default user
      run: |
        sudo arch-chroot ./mountpoint bash - <<'EOF'
        set -e
        userdel alarm
        EOF
    - name: Set locale
      run: |
        sudo arch-chroot ./mountpoint bash - <<'EOF'
        set -e
        sed -i "s|#en_US.UTF-8 UTF-8|en_US.UTF-8 UTF-8|g" "/etc/locale.gen"
        locale-gen
        echo "LANG=en_US.UTF-8" > "/etc/locale.conf"
        EOF
    - name: Configure pacman options
      run: |
        sudo arch-chroot ./mountpoint bash - <<'EOF'
        set -e
        sed -i "s/#ParallelDownloads/ParallelDownloads/g" /etc/pacman.conf
        sed -i "s/#DisableSandboxFilesystem/DisableSandboxFilesystem/g" /etc/pacman.conf
        sed -i "s/#DisableSandboxSyscalls/DisableSandboxSyscalls/g" /etc/pacman.conf
        EOF
    - name: Add nabu repo
      run: |
        sudo arch-chroot ./mountpoint bash - <<'EOF'
        set -e
        sed -i '/^\[core\]/i \[nabu]\nSigLevel = Never\nServer = https://github.com/Kumar-Jy/nabu-pkgs/releases/download/repo\n' /etc/pacman.conf
        n=0
        until pacman -Sy --noconfirm; do
          n=$((n+1))
          if [ $n -ge 3 ]; then
            echo "pacman -Sy failed after 3 attempts" >&2
            exit 1
          fi
          sleep 5
        done
        EOF
    - name: Remove generic kernel
      run: |
        sudo arch-chroot ./mountpoint bash - <<'EOF'
        set -e
        pacman -R --noconfirm linux-aarch64
        EOF
    - name: Update system
      run: |
        sudo arch-chroot ./mountpoint bash - <<'EOF'
        set -e
        n=0
        until pacman -Syu --noconfirm; do
          n=$((n+1))
          if [ $n -ge 3 ]; then
            echo "pacman -Syu failed after 3 attempts" >&2
            exit 1
          fi
          sleep 5
        done
        EOF
    - name: Install firmwares
      run: |
        sudo arch-chroot ./mountpoint bash - <<'EOF'
        set -e
        n=0
        until pacman -S --noconfirm linux-firmware-xiaomi-nabu; do
          n=$((n+1))
          if [ $n -ge 3 ]; then exit 1; fi
          sleep 5
        done
        EOF
    - name: Install ukify
      run: |
        sudo arch-chroot ./mountpoint bash - <<'EOF'
        set -e
        pacman -S --noconfirm ukify
        EOF
    - name: Install kernel and headers
      run: |
        sudo arch-chroot ./mountpoint bash -e <<'EOF'
        base=https://github.com/Kumar-Jy/nabu-pkgs/releases/download/repo
        for pkg in linux-nabu linux-nabu-headers; do
          curl -fL --retry 3 "$base/${pkg}-7.3.1-1-aarch64.pkg.tar.xz" -o "/tmp/${pkg}.pkg.tar.xz"
        done
        pacman -U --noconfirm /tmp/linux-nabu.pkg.tar.xz /tmp/linux-nabu-headers.pkg.tar.xz
        EOF
    - name: Install alsa ucm config
      run: |
        sudo arch-chroot ./mountpoint bash - <<'EOF'
        set -e
        n=0
        until pacman -S --noconfirm alsa-ucm-conf-xiaomi-nabu; do
          n=$((n+1))
          if [ $n -ge 3 ]; then exit 1; fi
          sleep 5
        done
        EOF
    - name: Install qualcomm firmware and services
      run: |
        sudo arch-chroot ./mountpoint bash - <<'EOF'
        set -e
        pacman -S --noconfirm qrtr tqftpserv rmtfs hexagonrpcd
        systemctl enable qrtr-ns || true
        systemctl enable tqftpserv rmtfs
        systemctl enable hexagonrpcd || true
        EOF
    - name: Install displaylink (evdi, works out of the box)
      run: |
        sudo arch-chroot ./mountpoint bash - <<'EOF'
        set -e
        pacman -S --noconfirm dkms evdi-dkms displaylink gcc make
        systemctl enable displaylink
        EOF
    - name: Disable sshd
      run: |
        sudo arch-chroot ./mountpoint bash - <<'EOF'
        set -e
        systemctl disable sshd
        EOF
    - name: Install and configure sudo
      run: |
        sudo arch-chroot ./mountpoint bash - <<'EOF'
        set -e
        pacman -S --noconfirm sudo
        echo "%wheel ALL=(ALL:ALL) ALL" > /etc/sudoers.d/10-wheel
        EOF
    - name: Install console font
      run: |
        sudo arch-chroot ./mountpoint bash - <<'EOF'
        set -e
        pacman -S --noconfirm terminus-font
        EOF
    - name: Apply base overlay
      run: |
        sudo cp ./repo/base/overlay/* -r ./mountpoint/
        sudo arch-chroot ./mountpoint bash - <<'EOF'
        set -e
        /overlay-post-apply
        rm /overlay-post-apply
        EOF
    - name: Install nabu wlan service and tools
      run: |
        sudo arch-chroot ./mountpoint bash - <<'EOF'
        set -e
        pacman -S --noconfirm nabu-pmac nabu-kclean
        systemctl enable nabu-pmac
        EOF
    - name: Enable zram-generator
      run: |
        sudo arch-chroot ./mountpoint bash - <<'EOF'
        set -e
        pacman -S --noconfirm zram-generator
        systemctl enable systemd-zram-setup@zram0.service
        EOF
    - name: Create efi
      run: |
        sudo arch-chroot ./mountpoint bash - <<'EOF'
        set -e
        cp /opt/nabu/efi-template/* -rv /boot/efi/
        mkdir /boot/efi/EFI/arch/
        rm /opt/nabu/efi-template -r
        EOF
    - name: Configure mkinitcpio
      run: |
        sudo arch-chroot ./mountpoint bash - <<'EOF'
        set -e
        sed -i -e "s/ autodetect//g" -e "s/ microcode//g" /etc/mkinitcpio.conf
        sed -i 's|^FILES=.*|FILES=(/etc/shadow /etc/passwd)|' /etc/mkinitcpio.conf
        EOF
    - name: Generate UKI
      run: |
        sudo arch-chroot ./mountpoint bash - <<'EOF'
        set -e
        set -e
        mkinitcpio -P
        if [ ! -f /boot/efi/EFI/arch/arch-linux-nabu.efi ]; then
          echo "ERROR: UKI /boot/efi/EFI/arch/arch-linux-nabu.efi was not generated" >&2
          exit 1
        fi
        ls -l /boot/efi/EFI/arch/
        EOF
    - name: Pack efi
      run: |
        sudo arch-chroot ./mountpoint bash - <<'EOF'
        set -e
        tar cvzf "/opt/nabu/efi.tgz" -C "/boot/efi/" .
        EOF
    - name: Install base packages
      run: |
        sudo arch-chroot ./mountpoint bash - <<'EOF'
        set -e
        pacman -S --noconfirm networkmanager bluez bluez-utils vulkan-freedreno iio-sensor-proxy psmisc dosfstools i2c-tools ntfs-3g iris-vaapi
        systemctl enable iio-sensor-proxy || true
        EOF
    - name: Enable bluetooth and network manager
      run: |
        sudo arch-chroot ./mountpoint bash - <<'EOF'
        set -e
        systemctl enable bluetooth NetworkManager
        EOF
    - name: Create user with password
      run: |
        sudo arch-chroot ./mountpoint bash - <<'EOF'
        set -e
        groupadd -f -r i2c
        useradd -m -G wheel,audio,video,storage,optical,i2c,input -s /bin/bash user
        echo "user:123456" | chpasswd
        EOF
    - name: Clear pacman cache
      run: |
        sudo arch-chroot ./mountpoint bash - <<'EOF'
        set -e
        pacman -Scc --noconfirm
        EOF
    - name: Unmount rootfs image
      run: |
        sudo umount -R ./mountpoint
        rmdir ./mountpoint
    - name: Compress rootfs image
      run: |
        e2fsck -f rootfs.img -y
        resize2fs rootfs.img -M
        pigz -9 rootfs.img
    - name: Upload rootfs artifact
      uses: actions/upload-artifact@v7
      with:
        name: arch-nabu-rootfs-base
        path: ./rootfs.img.gz
        retention-days: 90
        compression-level: 0
    timeout-minutes: 180
    if: ${{ inputs.base_run_id == '' }}
  build-hyprland-image:
    name: Build Hyprland + Serpantinum + touchscreen gestures
    runs-on: ubuntu-24.04-arm
    needs: build-base-image
    permissions:
      actions: read
    steps:
    - name: Update apt cache
      run: sudo apt-get update
    - name: Install tools
      run: sudo apt-get install -y git arch-install-scripts wget libarchive-tools e2fsprogs pigz dosfstools zip
    - name: Checkout repository
      uses: actions/checkout@v7
      with:
        path: repo
    - name: Download base image
      uses: actions/download-artifact@v8
      with:
        name: arch-nabu-rootfs-base
        run-id: ${{ inputs.base_run_id || github.run_id }}
        github-token: ${{ github.token }}
    - name: Unpack and mount base image
      run: |
        echo "::group::Unpack image"
        pigz -d rootfs.img.gz
        echo "::endgroup::"
        echo "::group::Expand image"
        e2fsck -f rootfs.img -y
        resize2fs rootfs.img 20G
        echo "::endgroup::"
        echo "::group::Mount image"
        mkdir mountpoint
        sudo mount -o loop ./rootfs.img ./mountpoint/
        sudo mkdir ./mountpoint/boot/efi/ -p
        sudo mount -o size=512M,mode=0755 -t tmpfs none ./mountpoint/boot/efi/
        echo "::endgroup::"
    - name: Unpack efi
      run: |
        sudo arch-chroot ./mountpoint bash - <<'EOF'
        set -e
        /opt/nabu/postinstall extract-efi
        EOF
    - name: Checkout pinned serpantinum
      uses: actions/checkout@v7
      with:
        repository: ilyamiro/serpantinum
        ref: 8e4fad180febb523588f63ca19ac049f37512272
        path: sources/serpantinum
        persist-credentials: false
    - name: Checkout pinned audio
      uses: actions/checkout@v7
      with:
        repository: ilyamiro/serpantinum-audio
        ref: 0a12c8d407a201c80b4862a60331af38bd0889e9
        path: sources/audio
        persist-credentials: false
    - name: Checkout pinned ski
      uses: actions/checkout@v7
      with:
        repository: ilyamiro/Ski
        ref: e6e2cdf49ab139bd39badff96c5c831b79148ed5
        path: sources/ski
        persist-credentials: false
    - name: Checkout pinned wvkbd
      uses: actions/checkout@v7
      with:
        repository: jjsullivan5196/wvkbd
        ref: f7e9ea3a7565decd0d120861c1cb36a7b6836244
        path: sources/wvkbd
        persist-credentials: false
    - name: Checkout pinned hyprgrass
      uses: actions/checkout@v7
      with:
        repository: horriblename/hyprgrass
        ref: 8ca1af717d5b4ea1215a781df52bcef02d7b15e6
        path: sources/hyprgrass
        persist-credentials: false
        submodules: recursive
    - name: Checkout pinned gamma relay
      uses: actions/checkout@v7
      with:
        repository: MaxVerevkin/wl-gammarelay-rs
        ref: 9874e4a273a01f60e578a896183d67aa7a23572c
        path: sources/gammarelay
        persist-credentials: false
    - name: Install desktop packages
      run: |
        sudo cp -a ./repo/hyprland/overlay/. ./mountpoint/
        sudo chmod +x ./mountpoint/usr/local/bin/nabu-*
        sudo mkdir -p ./mountpoint/var/tmp/nabu-src
        sudo cp -a ./sources/. ./mountpoint/var/tmp/nabu-src/
        sudo cp ./repo/hyprland/install-in-rootfs.sh ./mountpoint/root/
        sudo arch-chroot ./mountpoint bash /root/install-in-rootfs.sh packages
    - name: Restore native Rust build cache
      id: rust-cache
      uses: actions/cache/restore@v5
      with:
        path: |-
          mountpoint/var/tmp/nabu-src/ski/target
          mountpoint/var/tmp/nabu-src/gammarelay/target
          mountpoint/home/builduser/.cargo
        key: nabu-aarch64-rust-1.99-ski-e6e2cdf49-gamma-9874e4a2-v1
    - name: Build Hyprgrass and ARM64 applications
      id: native-build
      run: |
        sudo arch-chroot ./mountpoint bash /root/install-in-rootfs.sh build
    - name: Save native Rust build cache
      if: ${{ always() && steps.rust-cache.outputs.cache-hit != 'true' }}
      uses: actions/cache/save@v5
      with:
        path: |-
          mountpoint/var/tmp/nabu-src/ski/target
          mountpoint/var/tmp/nabu-src/gammarelay/target
          mountpoint/home/builduser/.cargo
        key: nabu-aarch64-rust-1.99-ski-e6e2cdf49-gamma-9874e4a2-v1
    - name: Configure touchscreen desktop
      run: |
        sudo arch-chroot ./mountpoint bash /root/install-in-rootfs.sh deploy
        sudo rm ./mountpoint/root/install-in-rootfs.sh
    - name: Pack efi
      run: |
        sudo arch-chroot ./mountpoint bash - <<'EOF'
        set -e
        rm -f /opt/nabu/efi.tgz
        tar cvzf "/opt/nabu/efi.tgz" -C "/boot/efi/" .
        EOF
    - name: Clear pacman cache
      run: |
        sudo arch-chroot ./mountpoint bash - <<'EOF'
        set -e
        pacman -Scc --noconfirm
        EOF
    - name: Export efi directory for artifact
      run: |
        mkdir -p ./efi
        sudo cp -a ./mountpoint/boot/efi/EFI/. ./efi/
        sudo chown -R $USER:$USER ./efi/
    - name: Unmount rootfs image
      run: |
        sudo umount -R ./mountpoint
        rmdir ./mountpoint
    - name: Prepare artifact directories
      run: |
        e2fsck -f rootfs.img -y
        resize2fs rootfs.img -M
        mkdir -p ./images
        mv ./rootfs.img ./images/
        mv ./repo/bin ./bin
        mv ./repo/DBKP ./DBKP
        mv ./repo/META-INF ./META-INF
        mv ./repo/installer ./installer
    - name: Download WinPE image
      run: |
        wget "https://github.com/WOAFlasher/WinInstaller/releases/download/WinPE/WinPE23H2.img" -qO ./installer/pe.img
    - name: Create ESP image
      run: |
        truncate -s 270M ./images/esp.img
        mkfs.fat -F 32 -S 4096 -s 1 -n ESPNABU ./images/esp.img
        mkdir -p ./esp-mount
        sudo mount -o loop ./images/esp.img ./esp-mount/
        sudo mkdir -p ./esp-mount/EFI
        sudo cp -r ./efi/* ./esp-mount/EFI/
        sudo umount ./esp-mount
        rmdir ./esp-mount
    - name: Copy flash scripts
      run: |
        cp ./repo/base/overlay/opt/nabu/fastboot-script/flash-linux.bat .
        cp ./repo/base/overlay/opt/nabu/fastboot-script/flash-linux.sh .
        chmod +x flash-linux.sh
    - name: Verify and hash installer payload
      run: |
        set -euo pipefail
        test -s images/rootfs.img
        test -s images/esp.img
        test -s efi/arch/arch-linux-nabu.efi
        e2fsck -fn images/rootfs.img
        cp repo/hyprland/SOURCES.json BUILD-SOURCES.json
        sha256sum images/* > SHA256SUMS
        zip -r -q -6 arch-nabu-installer-hyprland.zip bin DBKP efi images installer META-INF flash-linux.sh flash-linux.bat SHA256SUMS BUILD-SOURCES.json
        unzip -tq arch-nabu-installer-hyprland.zip
        sha256sum arch-nabu-installer-hyprland.zip > arch-nabu-installer-hyprland.zip.sha256
    - name: Upload installer artifact
      uses: actions/upload-artifact@v7
      with:
        name: arch-nabu-installer-hyprland
        path: |-
          arch-nabu-installer-hyprland.zip
          arch-nabu-installer-hyprland.zip.sha256
        retention-days: 14
        compression-level: 0
        if-no-files-found: error
    timeout-minutes: 180
    if: ${{ always() && (needs.build-base-image.result == 'success' || (needs.build-base-image.result == 'skipped' && inputs.base_run_id != ''))
      }}
'on':
  workflow_dispatch:
    inputs:
      base_run_id:
        description: Reuse successful base artifact from this repository run (empty = rebuild base)
        required: false
        type: string
        default: ''
permissions:
  contents: read
